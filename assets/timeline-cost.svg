<svg xmlns="http://www.w3.org/2000/svg" width="980" height="760" viewBox="0 0 980 760" role="img" aria-labelledby="title desc">
  <title id="title">Social Media Analytics Platform feasibility and cost</title>
  <desc id="desc">Six-month timeline and project budget estimate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef8f6"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#3157f7"/>
      <stop offset="1" stop-color="#00a99d"/>
    </linearGradient>
  </defs>
  <rect width="980" height="760" rx="30" fill="url(#bg)"/>
  <text x="56" y="76" fill="#12212b" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900">Feasibility Snapshot</text>
  <text x="56" y="112" fill="#65737f" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Six-month build plan with a $211,000 estimated project cost.</text>
  <g transform="translate(56 166)">
    <rect x="0" y="0" width="868" height="104" rx="18" fill="#12212b"/>
    <text x="30" y="42" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Estimated total</text>
    <text x="30" y="82" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900">$211,000</text>
    <text x="318" y="62" fill="#b6c5cb" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Core spending supports developers, data analysts, infrastructure, analytics tools, and testing.</text>
  </g>
  <g transform="translate(56 326)">
    <text x="0" y="0" fill="#12212b" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900">Timeline phases</text>
    <line x1="22" y1="70" x2="808" y2="70" stroke="#dce5ea" stroke-width="12" stroke-linecap="round"/>
    <line x1="22" y1="70" x2="808" y2="70" stroke="url(#bar)" stroke-width="12" stroke-linecap="round"/>
    <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
      <g transform="translate(22 70)">
        <circle r="22" fill="#3157f7"/><text y="7" fill="#ffffff" font-size="18" font-weight="900">1</text>
        <text y="58" fill="#12212b" font-size="15" font-weight="900">Research</text>
      </g>
      <g transform="translate(218 70)">
        <circle r="22" fill="#00a99d"/><text y="7" fill="#ffffff" font-size="18" font-weight="900">2</text>
        <text y="58" fill="#12212b" font-size="15" font-weight="900">Design</text>
      </g>
      <g transform="translate(414 70)">
        <circle r="22" fill="#f06a4d"/><text y="7" fill="#ffffff" font-size="18" font-weight="900">3</text>
        <text y="58" fill="#12212b" font-size="15" font-weight="900">Develop</text>
      </g>
      <g transform="translate(610 70)">
        <circle r="22" fill="#e2a83d"/><text y="7" fill="#ffffff" font-size="18" font-weight="900">4</text>
        <text y="58" fill="#12212b" font-size="15" font-weight="900">Test</text>
      </g>
      <g transform="translate(808 70)">
        <circle r="22" fill="#7a4df3"/><text y="7" fill="#ffffff" font-size="18" font-weight="900">5</text>
        <text y="58" fill="#12212b" font-size="15" font-weight="900">Launch</text>
      </g>
    </g>
  </g>
  <g transform="translate(56 514)" font-family="Inter, Arial, sans-serif">
    <text x="0" y="0" fill="#12212b" font-size="24" font-weight="900">Budget emphasis</text>
    <g transform="translate(0 34)">
      <rect width="868" height="36" rx="18" fill="#e8eef1"/>
      <rect width="610" height="36" rx="18" fill="#3157f7"/>
      <text x="20" y="25" fill="#ffffff" font-size="15" font-weight="900">Team and analytics expertise</text>
      <text x="706" y="25" fill="#12212b" font-size="15" font-weight="900">$148K</text>
    </g>
    <g transform="translate(0 90)">
      <rect width="868" height="36" rx="18" fill="#e8eef1"/>
      <rect width="128" height="36" rx="18" fill="#00a99d"/>
      <text x="20" y="25" fill="#ffffff" font-size="15" font-weight="900">Infrastructure</text>
      <text x="706" y="25" fill="#12212b" font-size="15" font-weight="900">$31K</text>
    </g>
    <g transform="translate(0 146)">
      <rect width="868" height="36" rx="18" fill="#e8eef1"/>
      <rect width="90" height="36" rx="18" fill="#f06a4d"/>
      <text x="20" y="25" fill="#ffffff" font-size="15" font-weight="900">Testing</text>
      <text x="706" y="25" fill="#12212b" font-size="15" font-weight="900">$22K</text>
    </g>
  </g>
</svg>
