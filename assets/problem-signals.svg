<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
  <title id="title">Inconsistent engagement signals</title>
  <desc id="desc">A visual showing unstable content performance and scattered audience signals.</desc>
