<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Social Media Analytics Platform feature board</title>
  <desc id="desc">A crisp dashboard-style feature board showing engagement analytics, posting recommendations, content performance, workflow steps, and benefits.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#d9f7ff"/>
      <stop offset="0.35" stop-color="#ffd6f1"/>
      <stop offset="0.72" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbfff3"/>
    </linearGradient>
    <linearGradient id="nav" x1="0" x2="1">
      <stop offset="0" stop-color="#3157f7"/>
      <stop offset="1" stop-color="#7a4df3"/>
    </linearGradient>
    <style>
      .font { font-family: Inter, Arial, sans-serif; }
      .title { fill: #12212b; font-size: 27px; font-weight: 900; }
      .small { fill: #65737f; font-size: 13px; font-weight: 700; }
      .tiny { fill: #65737f; font-size: 11px; font-weight: 700; }
      .label { fill: #12212b; font-size: 14px; font-weight: 900; }
      .value { fill: #12212b; font-size: 26px; font-weight: 900; }
      .white { fill: #ffffff; }
    </style>
  </defs>
  <rect width="1200" height="780" fill="url(#canvas)"/>
  <rect x="20" y="20" width="1160" height="740" rx="24" fill="#ffffff" opacity="0.96"/>
  <text x="600" y="70" text-anchor="middle" class="font title">Social Media Analytics Platform</text>
  <text x="600" y="96" text-anchor="middle" class="font small" fill="#3157f7">DATA-DRIVEN INSIGHTS. SMARTER CONTENT. STRONGER GROWTH.</text>
  <g transform="translate(50 120)">
    <rect width="205" height="252" rx="14" fill="#f7f9fb" stroke="#dce5ea"/>
    <rect width="205" height="44" rx="14" fill="url(#nav)"/>
    <text x="16" y="28" class="font white" font-size="14" font-weight="900">1. Platform Purpose</text>
    <text x="16" y="68" class="font label">The platform helps creators</text>
    <text x="16" y="87" class="font small">understand performance and</text>
    <text x="16" y="104" class="font small">improve content with clear</text>
    <text x="16" y="121" class="font small">recommendations.</text>
    <text x="16" y="154" class="font label">Key features</text>
    <text x="44" y="188" class="font tiny">Engagement analytics</text>
    <text x="44" y="221" class="font tiny">Posting recommendations</text>
    <text x="44" y="254" class="font tiny">Content performance panel</text>
  </g>
  <g transform="translate(282 120)">
    <rect width="642" height="252" rx="14" fill="#f7f9fb" stroke="#dce5ea"/>
    <text x="22" y="34" class="font label">Welcome back, Creator</text>
    <text x="22" y="55" class="font tiny">Your best-performing patterns are ready to review.</text>
    <g transform="translate(22 76)">
      <rect width="136" height="62" rx="12" fill="#ffffff" stroke="#dce5ea"/>
      <text x="14" y="24" class="font tiny">Total reach</text>
      <text x="14" y="50" class="font value">128K</text>
    </g>
    <g transform="translate(174 76)">
      <rect width="136" height="62" rx="12" fill="#ffffff" stroke="#dce5ea"/>
      <text x="14" y="24" class="font tiny">Engagement</text>
      <text x="14" y="50" class="font value">25.6K</text>
    </g>
    <g transform="translate(326 76)">
      <rect width="136" height="62" rx="12" fill="#ffffff" stroke="#dce5ea"/>
      <text x="14" y="24" class="font tiny">Profile visits</text>
      <text x="14" y="50" class="font value">46.2K</text>
    </g>
    <g transform="translate(478 76)">
      <rect width="136" height="62" rx="12" fill="#ffffff" stroke="#dce5ea"/>
      <text x="14" y="24" class="font tiny">Impressions</text>
      <text x="14" y="50" class="font value">312K</text>
    </g>
    <rect x="22" y="162" width="292" height="72" rx="12" fill="#ffffff" stroke="#dce5ea"/>
    <text x="36" y="186" class="font tiny">Engagement over time</text>
    <path d="M40 218C72 196 98 204 126 190s52-16 84 10 64 28 94 2" fill="none" stroke="#3157f7" stroke-width="4" stroke-linecap="round"/>
    <rect x="336" y="162" width="126" height="72" rx="12" fill="#ffffff" stroke="#dce5ea"/>
    <text x="350" y="186" class="font tiny">Engagement by type</text>
    <circle cx="399" cy="210" r="22" fill="none" stroke="#3157f7" stroke-width="11"/>
    <rect x="484" y="162" width="130" height="72" rx="12" fill="#ffffff" stroke="#dce5ea"/>
    <text x="498" y="186" class="font tiny">Best time to post</text>
  </g>
  <g transform="translate(950 120)">
    <rect width="200" height="252" rx="14" fill="#f7f9fb" stroke="#dce5ea"/>
    <text x="16" y="34" class="font label">Best next action</text>
    <rect x="16" y="54" width="168" height="76" rx="12" fill="#ffffff" stroke="#dce5ea"/>
    <text x="32" y="82" class="font tiny">Post a short video</text>
    <text x="32" y="101" class="font tiny">between 6 PM and 8 PM.</text>
    <rect x="16" y="146" width="168" height="86" rx="12" fill="#ffffff" stroke="#dce5ea"/>
    <text x="30" y="170" class="font tiny">Suggested next steps</text>
    <text x="46" y="197" class="font tiny">Repeat visual hook</text>
    <text x="46" y="219" class="font tiny">Use stronger caption</text>
  </g>
  <g transform="translate(50 398)">
    <rect width="1100" height="132" rx="14" fill="#f7f9fb" stroke="#dce5ea"/>
    <text x="20" y="36" class="font label">How the platform works</text>
    <text x="20" y="70" class="font small">Connect accounts → collect performance data → find audience patterns → generate recommendations → act with confidence.</text>
  </g>
  <g transform="translate(50 558)">
    <rect width="1100" height="132" rx="14" fill="#f7f9fb" stroke="#dce5ea"/>
    <text x="20" y="34" class="font label">Key Benefits</text>
    <text x="92" y="76" class="font label">Creator-friendly insight</text>
    <text x="360" y="76" class="font label">Better decisions</text>
    <text x="628" y="76" class="font label">Stronger content</text>
    <text x="894" y="76" class="font label">Platform growth</text>
  </g>
</svg>
